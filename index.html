<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kevin - Desktop Resume</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="resources/fonts/fonts.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    canvas {
      display: block;
    }
    #boot-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #1d1f2b 0%, #08090e 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 300ms ease, visibility 300ms ease;
    }
    #boot-overlay.boot-hidden {
      opacity: 0;
      visibility: hidden;
    }
    .boot-apple {
      width: 82px;
      height: 82px;
      margin-bottom: 32px;
    }
    .boot-apple svg {
      width: 100%;
      height: 100%;
      fill: #f0f0f5;
    }
    .boot-bar {
      width: 180px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
      position: relative;
    }
    .boot-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #f5f6fb;
      transform-origin: left center;
      animation: boot-progress 2.8s ease-in-out infinite;
    }
    @keyframes boot-progress {
      0% { transform: scaleX(0.05); opacity: 0.2; }
      20% { transform: scaleX(0.4); opacity: 0.7; }
      60% { transform: scaleX(0.85); opacity: 1; }
      100% { transform: scaleX(1); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div id="boot-overlay">
    <div class="boot-apple" aria-hidden="true">
      <svg viewBox="0 0 256 315" role="presentation">
        <path d="M213.8 167.9c-.4-39.4 32.3-58.1 33.8-59-18.4-27-47-30.7-57.1-31.2-24.3-2.5-47.4 14.3-59.7 14.3-12.1 0-31.4-13.9-51.6-13.6-26.5.4-50.9 15.4-64.5 39.1-27.5 47.6-7 118 19.7 156.5 13 18.8 28.6 39.8 49.1 39 19.7-.8 27.2-12.6 51-12.6 23.8 0 30.5 12.6 51.6 12.1 21.4-.3 35-19.2 48-38.1 15.2-22.2 21.5-43.8 21.8-44.8-.5-.2-41.6-15.8-42.1-61.7zm-39-112.1c10.8-13.2 18.1-31.4 16.1-49.8-15.6.6-34.4 10.4-45.6 23.5-10 11.6-18.8 30.3-16.5 48.2 17.6 1.4 35.1-8.9 46-21.9z"/>
      </svg>
    </div>
    <div class="boot-bar" aria-label="Loading macOS experience"></div>
  </div>

  <!-- p5.js -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>

  <!-- Your desktop code (order matters) -->
  <script src="scripts/window.js"></script>
  <script src="scripts/files.js"></script>
  <script src="scripts/dock.js"></script>
  <script src="scripts/topbar.js"></script>
  <script src="scripts/desktop.js"></script>
  <script src="scripts/core.js"></script>
  <script>
    document.addEventListener("desktop-ready", () => {
      const overlay = document.getElementById("boot-overlay");
      if (overlay) {
        overlay.classList.add("boot-hidden");
        setTimeout(() => overlay.remove(), 1200);
      }
    });
  </script>
</body>
</html>
